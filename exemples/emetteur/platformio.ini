; ============================================================================
;  Exemple emetteur — espNow_SharedVar (PlatformIO)
;  Compilation :  pio run    (depuis ce dossier)
; ============================================================================

; La librairie (src/EspNowSharedVariable.h + library.json) est a la RACINE du
; depot, trois dossiers au-dessus (exemples/emetteur -> racine).
; Une fois publiee sur GitHub (convention Fo170 : TOUJOURS la forme git
; complete, jamais "lib_deps = Fo170/espNow_SharedVar") :
; lib_deps = https://github.com/Fo170/espNow_SharedVar.git

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ../..

[env:esp8266_d1mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps = ../..
